[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modelarena"
version = "0.1.0"
description = "Every AI model launch covered like a big game: box scores, records and recaps."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "eliem08" }]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: Other/Proprietary License",
  "Operating System :: OS Independent",
  "Private :: Do Not Upload",
]

[project.optional-dependencies]
dev = ["ruff==0.15.20"]

[project.scripts]
modelarena = "modelarena.__main__:main"
modelarena-web = "modelarena.web:main"

[project.urls]
Repository = "https://github.com/eliem08/modelarena"

[tool.setuptools]
packages = ["modelarena"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I", "SIM", "RUF"]
ignore = ["E501", "E741", "SIM108", "RUF001", "RUF002", "RUF003", "RUF022", "B905"]  # E501: ruff format owns line length

[tool.ruff.lint.per-file-ignores]
"modelarena/__init__.py" = ["F401", "F403"]
"tests/*" = ["E501"]
